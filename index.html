<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Year · Bird call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --paper:#F3E9D2; --ink:#2F241A; --band:#DCCB98; --deep:#A88B4A; --gold:#E2B44C; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: 'Barlow Semi Condensed', Arial, sans-serif;
       display: flex; flex-direction: column; align-items: center; }
header { width: 100%; background: var(--band); border-bottom: 3px solid var(--deep); text-align: center; padding: 18px 16px 14px; }
header small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .3em; }
header h1 { margin: 2px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 36px; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; text-align: center; }
.deck { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 700; }
.id { font-size: 14px; font-weight: 700; letter-spacing: .2em; opacity: .7; }
button { width: 168px; height: 168px; border-radius: 50%; border: 4px solid var(--gold); background: var(--ink); color: #FFFBF1;
         box-shadow: 0 0 0 4px var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
button:focus-visible { outline: 3px solid var(--deep); outline-offset: 6px; }
button svg { width: 72px; height: 72px; }
.hint { font-size: 20px; font-weight: 700; }
.msg { max-width: 320px; font-size: 16px; line-height: 1.4; }
footer { padding: 14px 16px 20px; font-size: 12px; opacity: .75; text-align: center; }
footer a { color: inherit; }
</style>
</head>
<body>
<header><small>BIRD CALL</small><h1>The Big Year</h1></header>
<main>
  <div><div class="deck" id="deck">&nbsp;</div><div class="id" id="cid">&nbsp;</div></div>
  <button id="play" type="button" aria-label="Play the bird call" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" id="icon"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="hint" id="hint" hidden>Listen… which bird is it?</div>
  <div class="msg" id="msg"></div>
  <audio id="audio" preload="auto"></audio>
</main>
<footer id="credit"></footer>
<script>
const DECKS = { HVD:"Highveld", MAG:"Magoebaskloof", KRU:"Kruger", ZUL:"Zululand & iSimangaliso", DRA:"Drakensberg",
  KAL:"Kalahari", KAR:"Karoo", WCO:"West Coast", FYN:"Fynbos & Cape", GAR:"Garden Route", PEL:"Pelagic",
  VIC:"Victoria Falls", MAR:"Marion Island" };
const $ = id => document.getElementById(id);
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
async function show() {
  const id = decodeURIComponent(location.hash.slice(1)).toUpperCase().trim();
  const audio = $("audio");
  audio.pause(); $("play").hidden = true; $("hint").hidden = true; $("msg").textContent = ""; $("credit").textContent = "";
  $("deck").textContent = DECKS[id.split("-")[0]] || "The Big Year";
  $("cid").textContent = id || "";
  if (!id) { $("msg").textContent = "Scan a CALL card to hear its bird."; return; }
  let calls = {};
  try { calls = await (await fetch("calls.json", { cache: "no-cache" })).json(); } catch (e) {}
  const c = calls[id];
  if (!c) { $("msg").textContent = "This call hasn't been added yet. Ask the quizmaster to describe it instead!"; return; }
  audio.src = "calls/" + c.file;
  $("play").hidden = false; $("hint").hidden = false;
  $("credit").innerHTML = "Recording: " + c.recordist + " · " + c.licence + ' · <a href="credits.html">credits</a>';
}
$("play").addEventListener("click", () => { const a = $("audio"); a.paused ? a.play() : a.pause(); });
$("audio").addEventListener("play", () => $("icon").innerHTML = PAUSE);
$("audio").addEventListener("pause", () => $("icon").innerHTML = PLAY);
$("audio").addEventListener("ended", () => $("icon").innerHTML = PLAY);
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
